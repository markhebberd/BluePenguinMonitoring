<VirtualHost *:80>
    DocumentRoot /var/www/html

    # NOTE: no HTTP->HTTPS redirect here on purpose. The repo's wildwatch_web/.htaccess
    # forces HTTPS and MUST NOT be copied to the NAS — this mirror is plain HTTP on the LAN.
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        # SPA fallback: anything that isn't a real file, a real dir, or an API call
        # is a client-side route (/day/2026-07-23, /bird/PT319, ...).
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    # The dump can be large-ish; give backup.php room if it is ever called here.
    <Files "backup.php">
        Require all granted
    </Files>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
