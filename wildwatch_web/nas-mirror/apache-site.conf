<VirtualHost *:80>
    DocumentRoot /var/www/html

    # Pass the Authorization header through to PHP. Apache drops it by default, so
    # $_SERVER['HTTP_AUTHORIZATION'] is empty and every Bearer-token request fails auth —
    # login would mint a token that the very next request rejects. (nginx on production
    # forwards it, which is why this only bites the Apache mirror.)
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    # NOTE: no HTTP->HTTPS redirect here on purpose. The repo's wildwatch_web/.htaccess
    # forces HTTPS and MUST NOT be copied to the NAS — this mirror is plain HTTP on the LAN.
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        # SPA fallback: anything that isn't a real file, a real dir, an API call or the
        # status page is a client-side route (/day/2026-07-23, /bird/PT319, ...).
        RewriteCond %{REQUEST_URI} !^/(api|status)/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    # Nightly restore report, written by bin/nightly.sh.
    Alias /status /var/www/status
    <Directory /var/www/status>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    # The mirror is a restore TARGET, not a backup source. Its own whole-database dump
    # endpoint and its credentials file have no purpose here and must never be reachable --
    # especially once this is exposed through the Cloudflare tunnel. Cloudflare Access gates
    # everything in front of this too; blocking here is defence in depth (and also covers the
    # LAN). backup.php never runs on the mirror; the nightly pulls from PRODUCTION's endpoint.
    <FilesMatch "^(backup|secrets)\.php$">
        Require all denied
    </FilesMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
