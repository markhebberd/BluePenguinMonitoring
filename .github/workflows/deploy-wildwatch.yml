name: Deploy wildwatch

# The VPS pulls origin/main and builds the SPA itself (npm + vite), then assembles
# an atomic release and flips `current` with a smoke test + auto-rollback. This job
# only triggers that server-side deploy over SSH — no build/rsync happens in CI.
#
# The SSH key is pinned to a forced command on the VPS (command="…/deploy.sh"), so it
# can only run the deploy script, never a general shell.

on:
  push:
    branches: [main]
    paths:
      - 'wildwatch_web/**'
      - 'scripts/check-no-raw-writes.sh'
      - '.github/workflows/deploy-wildwatch.yml'
  workflow_dispatch:

concurrency:
  group: deploy-wildwatch
  cancel-in-progress: false

jobs:
  # Server-side enforcement of the data-gateway invariant. The pre-commit hook is opt-in
  # per clone and skippable (--no-verify); this is not — a raw write never deploys.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No raw writes outside the data gateway
        run: scripts/check-no-raw-writes.sh

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Trigger VPS pull-and-build deploy
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          # Command is ignored — the VPS forces deploy.sh. Output/exit code stream back.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" deploy
